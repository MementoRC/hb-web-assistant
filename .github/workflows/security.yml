name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@8f6fe6495de08228f74fa51f92070b131911d268 # v4.0.0
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: write
    secrets: inherit
