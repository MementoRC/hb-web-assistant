name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@2e45ef2ffe9211214d5fefa67d5036d3ac780a13 # v4.1.0
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit  # pragma: allowlist secret
