name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@0483e3dcb80aa9b0a7e06f9df8f8128fc73c0746  # v2.9.9
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit
