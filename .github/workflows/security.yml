name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@a5dc6bd9422eb649eb071b2f79c6e0406870dc49 # v4.2.0
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit  # pragma: allowlist secret
